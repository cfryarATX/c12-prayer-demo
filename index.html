<style>
  #gate { position: fixed; inset: 0; z-index: 1000; background: #152d38; color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #gate .box { width: 100%; max-width: 360px; text-align: center; }
  #gate img { width: 96px; height: 96px; border-radius: 22px; }
  #gate h1 { font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 4px; }
  #gate p { color: #a9bcc5; margin: 0 0 18px; font-size: 15px; }
  #gate input { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: #1e3c49; color: #fff; font-size: 18px; padding: 0 14px; text-align: center; outline: 0; }
  #gate input:focus { border-color: #d7b883; }
  #gate button { width: 100%; min-height: 52px; margin-top: 12px; border: 0; border-radius: 12px; background: #d7b883; color: #10262f; font-size: 17px; font-weight: 700; }
  #gate .err { color: #ffb4a8; min-height: 22px; margin-top: 10px; font-size: 15px; }
  html.unlocked #gate { display: none; }
  .demo-bar { position: relative; }
  .demo-bar #demo-menu-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; margin: -2px -4px -2px 0; border: 0; border-radius: 12px; background: #10262f; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .demo-bar #demo-menu-btn span { display: block; width: 20px; height: 2px; border-radius: 2px; background: #d7b883; }
  .demo-bar #demo-menu-btn:focus-visible { outline: 2px solid #10262f; outline-offset: 2px; }
  #demo-menu { position: absolute; top: 48px; right: 8px; z-index: 900; min-width: 200px; padding: 6px; border-radius: 14px; background: #10262f; border: 1px solid rgba(215,184,131,.45); box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  #demo-menu[hidden] { display: none; }
  #demo-menu button { display: block; width: 100%; min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #fff8ec; font-size: 16px; font-weight: 600; text-align: left; }
  #demo-menu button:active, #demo-menu button:focus-visible { background: #1e3c49; outline: 0; }
  #demo-menu hr { border: 0; border-top: 1px solid rgba(215,184,131,.35); margin: 6px 4px; }
  #demo-menu #demo-logout { color: #d7b883; }
</style>

/* Minimal Google Apps Script mocks: enough to run Code.gs in Node or a browser. */
(function (root) {
  function makeMocks(opts) {
    opts = opts || {};
    var tz = opts.tz || 'America/Chicago';
    var state = { sent: [], triggers: [], ownerEmail: opts.ownerEmail || 'owner@example.com', url: opts.url || '' , uuidSeq: 0};

    function Sheet(name) { this.name = name; this.data = []; this.frozen = 0; }
    Sheet.prototype.getName = function () { return this.name; };
    Sheet.prototype.width = function () { return this.data.reduce(function (m, r) { return Math.max(m, r.length); }, 0); };
    Sheet.prototype.getLastRow = function () { return this.data.length; };
    Sheet.prototype.getLastColumn = function () { return this.width(); };
    Sheet.prototype.setFrozenRows = function (n) { this.frozen = n; };
    Sheet.prototype.appendRow = function (row) { this.data.push(row.slice()); return this; };
    Sheet.prototype.deleteRow = function (r) { this.data.splice(r - 1, 1); };
    Sheet.prototype.getDataRange = function () { return this.getRange(1, 1, Math.max(this.data.length, 1), Math.max(this.width(), 1)); };
    Sheet.prototype.getRange = function (row, col, nr, nc) {
      var sh = this; nr = nr || 1; nc = nc || 1;
      var range = {
        getValues: function () {
          var out = [];
          for (var i = 0; i < nr; i++) { var r = []; for (var j = 0; j < nc; j++) { var v = (sh.data[row - 1 + i] || [])[col - 1 + j]; r.push(v === undefined ? '' : v); } out.push(r); }
          if (sh.data.length === 0) return [[]].slice(0, 1).map(function () { return []; });
          return out;
        },
        setValues: function (vals) {
          if (vals.length !== nr || vals[0].length !== nc) throw new Error('Range size mismatch');
          for (var i = 0; i < nr; i++) { while (sh.data.length < row + i) sh.data.push([]); for (var j = 0; j < nc; j++) sh.data[row - 1 + i][col - 1 + j] = vals[i][j]; }
          return range;
        },
        setFontWeight: function () { return range; },
        setNumberFormat: function () { return range; }
      };
      return range;
    };

    var sheets = [new Sheet('Sheet1')];
    var ss = {
      getSheetByName: function (n) { return sheets.filter(function (s) { return s.name === n; })[0] || null; },
      insertSheet: function (n) { var s = new Sheet(n); sheets.push(s); return s; },
      getSheets: function () { return sheets.slice(); },
      deleteSheet: function (s) { sheets = sheets.filter(function (x) { return x !== s; }); }
    };

    function pad(n) { return ('0' + n).slice(-2); }
    function parts(d) {
      var f = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
      var o = {}; f.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
      return o;
    }

    var g = {
      SpreadsheetApp: { getActive: function () { return ss; }, getUi: function () { throw new Error('No UI in tests'); } },
      Utilities: {
        getUuid: function () {
          if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
          if (typeof require === 'function') return require('crypto').randomUUID();
          var h = '0123456789abcdef', out = '';
          var rnd = function () { if (typeof crypto !== 'undefined' && crypto.getRandomValues) { return crypto.getRandomValues(new Uint8Array(1))[0] % 16; } return Math.floor(Math.random() * 16); };
          for (var i = 0; i < 36; i++) out += (i === 8 || i === 13 || i === 18 || i === 23) ? '-' : h[rnd()];
          return out;
        },
        formatDate: function (d, zone, fmt) {
          var p = parts(d);
          return fmt.replace('yyyy', p.year).replace('MM', p.month).replace('dd', p.day).replace('HH', p.hour);
        }
      },
      Session: { getScriptTimeZone: function () { return tz; }, getEffectiveUser: function () { return { getEmail: function () { return state.ownerEmail; } }; } },
      LockService: { getScriptLock: function () { return { waitLock: function () {}, releaseLock: function () {} }; } },
      MailApp: { sendEmail: function (o) { state.sent.push(o); } },
      ScriptApp: {
        getProjectTriggers: function () { return state.triggers.slice(); },
        deleteTrigger: function (t) { state.triggers = state.triggers.filter(function (x) { return x !== t; }); },
        newTrigger: function (fn) {
          var t = { fn: fn, kind: null, every: null, getHandlerFunction: function () { return fn; } };
          return { timeBased: function () { return { everyHours: function (n) { t.kind = 'hours'; t.every = n; return { create: function () { state.triggers.push(t); return t; } }; },
            everyMinutes: function (n) { t.kind = 'minutes'; t.every = n; return { create: function () { state.triggers.push(t); return t; } }; } }; } };
        },
        getService: function () { return { getUrl: function () { return state.url; } }; }
      },
      Logger: { log: function () {} },
      HtmlService: {}
    };
    // Save and restore every tab (used by the browser demo to keep data in localStorage).
    function dump() {
      return sheets.map(function (sh) {
        return { name: sh.name, data: sh.data.map(function (r) { return r.map(function (v) { return Object.prototype.toString.call(v) === '[object Date]' ? { __d: v.toISOString() } : v; }); }) };
      });
    }
    function load(saved) {
      sheets = saved.map(function (x) {
        var sh = new Sheet(x.name);
        sh.data = x.data.map(function (r) { return r.map(function (v) { return v && typeof v === 'object' && v.__d ? new Date(v.__d) : v; }); });
        return sh;
      });
    }
    return { globals: g, state: state, ss: ss, pad: pad, dump: dump, load: load };
  }

<script>
/**
 * C12 Prayer: a shared prayer-request web app for C12 boards.
 * Google Sheet + Apps Script. Paste this file into Code.gs and the page into Index.html.
 *
 * Tabs: Boards, Members, Requests, Settings, Profiles (setup() creates them).
 * Roles: member (adds own requests), admin (runs one board), super (the Sheet owner; runs every board).
 */

var APP_NAME = 'C12 Prayer';

var TABS = {
  Boards: ['BoardId', 'Name', 'AdminName', 'AdminEmail', 'AlertDay', 'AlertHour', 'MembersPerAlert', 'RotationPointer', 'LastAlertMonth', 'Active', 'CreatedAt'],
  Members: ['MemberId', 'BoardId', 'Name', 'Email', 'Role', 'Token', 'Active', 'SortOrder', 'CreatedAt'],
  Requests: ['RequestId', 'BoardId', 'MemberId', 'Month', 'Text', 'Status', 'CreatedAt', 'CreatedBy', 'AnsweredAt'],
  Settings: ['Key', 'Value', 'Notes'],
  Profiles: ['ProfileId', 'BoardId', 'MemberId', 'Month', 'WalkWithGod', 'DisciplingOthers', 'MarriageFamily', 'PersonalFinances',
    'BiblicalCommunity', 'FunRecreation', 'FitnessNutrition', 'RestRetreat', 'Wins', 'UpdatedAt', 'UpdatedBy']
};

// Life & Leadership Balance Wheel areas, in the official C12 Member Snapshot order.
var PROFILE_AREAS = [
  { key: 'WalkWithGod', label: 'Walk with God' },
  { key: 'DisciplingOthers', label: 'Discipling Others' },
  { key: 'MarriageFamily', label: 'Marriage & Family' },
  { key: 'PersonalFinances', label: 'Personal Finances' },
  { key: 'BiblicalCommunity', label: 'Biblical Community' },
  { key: 'FunRecreation', label: 'Fun & Recreation' },
  { key: 'FitnessNutrition', label: 'Fitness & Nutrition' },
  { key: 'RestRetreat', label: 'Rest & Retreat' }
];
var MAX_WINS_LINES = 3;
var MAX_WINS_CHARS = 400;

// Columns that must stay plain text so Sheets never turns them into dates or numbers.
var TEXT_COLUMNS = {
  Boards: ['BoardId', 'RotationPointer', 'LastAlertMonth'],
  Members: ['MemberId', 'BoardId', 'Token'],
  Requests: ['RequestId', 'BoardId', 'MemberId', 'Month', 'CreatedBy'],
  Settings: ['Key', 'Value'],
  Profiles: ['ProfileId', 'BoardId', 'MemberId', 'Month', 'UpdatedBy']
};

var DEFAULT_SETTINGS = [
  ['AppName', APP_NAME, 'Name shown in the app header and on the home screen.'],
  ['AppUrl', '', 'The web app link (ends in /exec). Use the C12 Prayer menu > Save the web app link.'],
  ['FaviconUrl', 'https://www.joinc12.com/wp-content/uploads/2021/08/cropped-Logo-mark_512x512-192x192.png', 'Browser tab icon: a public https link to a square PNG. Default is the C12 mark from joinc12.com.']
];

var ROLE = { MEMBER: 'member', ADMIN: 'admin', SUPER: 'super' };
var MAX_TEXT = 2000;

/* ------------------------------------------------------------------ */
/* Setup, menu, and web entry points                                   */
/* ------------------------------------------------------------------ */

/** Run once from the Apps Script editor. Safe to run again; it never deletes data. */
function setup() {
  var ss = ss_();
  Object.keys(TABS).forEach(function (name) {
    var sh = ss.getSheetByName(name) || ss.insertSheet(name);
    var head = TABS[name];
    sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');
    sh.setFrozenRows(1);
    TEXT_COLUMNS[name].forEach(function (col) {
      sh.getRange(1, head.indexOf(col) + 1, 1000, 1).setNumberFormat('@');
    });
  });

  var settings = table_('Settings');
  DEFAULT_SETTINGS.forEach(function (row) {
    if (!settings.rows.some(function (r) { return r.Key === row[0]; })) {
      append_('Settings', { Key: row[0], Value: row[1], Notes: row[2] });
    }
  });

  var ownerEmail = ownerEmail_();
  if (table_('Boards').rows.length === 0) {
    var board = newBoard_('My C12 Board', 'Admin', ownerEmail);
    append_('Members', newMember_(board.BoardId, 'Admin', ownerEmail, ROLE.SUPER, 1));
  }

  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'hourlyCheck') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('hourlyCheck').timeBased().everyHours(1).create();

  var sheet1 = ss.getSheetByName('Sheet1');
  if (sheet1 && sheet1.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(sheet1);

  Logger.log('Setup is done.');
  return 'ok';
}

function onOpen() {
  SpreadsheetApp.getUi().createMenu('C12 Prayer')
    .addItem('Save the web app link', 'menuSaveAppUrl')
    .addItem("Show everyone's links", 'menuShowLinks')
    .addSeparator()
    .addItem('Run setup again', 'setup')
    .addToUi();
}

function menuSaveAppUrl() {
  var ui = SpreadsheetApp.getUi();
  var res = ui.prompt('Save the web app link', 'Paste the Web app link here. It starts with https://script.google.com and ends with /exec.', ui.ButtonSet.OK_CANCEL);
  if (res.getSelectedButton() !== ui.Button.OK) return;
  var url = cleanAppUrl_(res.getResponseText());
  if (!url) {
    ui.alert('That does not look like the Web app link. It should start with https://script.google.com and end with /exec.');
    return;
  }
  setSetting_('AppUrl', url);
  ui.alert('Saved. Next, use C12 Prayer > Show everyone\'s links.');
}

function menuShowLinks() {
  var url = appUrl_();
  var ui = SpreadsheetApp.getUi();
  if (!url) {
    ui.alert('First use C12 Prayer > Save the web app link.');
    return;
  }
  var boards = table_('Boards').rows;
  var members = table_('Members').rows.filter(function (m) { return isTrue_(m.Active); });
  var html = '<div style="font-family:Arial,sans-serif;font-size:14px">';
  boards.forEach(function (b) {
    html += '<h3 style="margin:16px 0 6px">' + esc_(b.Name) + '</h3>';
    sortMembers_(members.filter(function (m) { return m.BoardId === b.BoardId; })).forEach(function (m) {
      var link = url + '?t=' + m.Token;
      html += '<p style="margin:0 0 10px"><b>' + esc_(m.Name) + '</b> (' + esc_(roleLabel_(m.Role)) + ')<br>' +
        '<input style="width:100%;font-size:13px;padding:4px" readonly onclick="this.select()" value="' + esc_(link) + '"></p>';
    });
  });
  html += '<p style="color:#555">Click a link box, then press Ctrl+C (Cmd+C on a Mac) to copy it.</p></div>';
  ui.showModalDialog(HtmlService.createHtmlOutput(html).setWidth(720).setHeight(520), "Everyone's personal links");
}

function doGet(e) {
  var token = (e && e.parameter && e.parameter.t) ? String(e.parameter.t) : '';
  if (!getSetting_('AppUrl')) {
    try {
      var url = cleanAppUrl_(ScriptApp.getService().getUrl());
      if (url) setSetting_('AppUrl', url);
    } catch (err) { /* not deployed yet */ }
  }
  var appName = getSetting_('AppName') || APP_NAME;
  var t = HtmlService.createTemplateFromFile('Index');
  t.token = token;
  t.appName = appName;
  var out = t.evaluate()
    .setTitle(appName)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .addMetaTag('apple-mobile-web-app-capable', 'yes')
    .addMetaTag('mobile-web-app-capable', 'yes');
  var fav = getSetting_('FaviconUrl');
  if (fav) {
    try { out.setFaviconUrl(fav); } catch (err) { /* ignore a bad icon link */ }
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* The one function the page calls                                     */
/* ------------------------------------------------------------------ */

/**
 * Every page action comes through here. The token from the member's personal
 * link decides who they are and what they may do.
 */
function api(token, action, payload) {
  payload = payload || {};
  try {
    var handler = ACTIONS[action];
    if (!handler) throw new Error('Unknown action.');
    var lock = handler.write ? LockService.getScriptLock() : null;
    if (lock) lock.waitLock(20000);
    try {
      var ctx = context_(token, payload.boardId);
      if (handler.need === 'manage' && !ctx.canManage) throw new Error('Only the board admin can do that.');
      if (handler.need === 'super' && !ctx.isSuper) throw new Error('Only the app owner can do that.');
      return { ok: true, data: handler.run(ctx, payload) };
    } finally {
      if (lock) lock.releaseLock();
    }
  } catch (err) {
    return { ok: false, error: err && err.message ? err.message : String(err) };
  }
}

var ACTIONS = {
  load: { run: function (ctx) { return loadData_(ctx); } },

  saveRequest: { write: true, run: function (ctx, p) {
    var text = String(p.text || '').trim();
    if (!text) throw new Error('Please type a prayer request.');
    if (text.length > MAX_TEXT) throw new Error('Please keep a request under ' + MAX_TEXT + ' characters.');
    var month = String(p.month || monthKey_(now_()));
    if (!/^\d{4}-\d{2}$/.test(month)) throw new Error('Pick a month.');
    if (p.id) {
      var req = findRequest_(ctx, p.id);
      requireOwnOrManage_(ctx, req.MemberId);
      req.Text = text;
      req.Month = month;
      update_('Requests', req);
      return loadData_(ctx);
    }
    var memberId = p.memberId || (ctx.me.BoardId === ctx.boardId ? ctx.me.MemberId : '');
    var member = findMember_(ctx, memberId);
    requireOwnOrManage_(ctx, member.MemberId);
    append_('Requests', {
      RequestId: newId_('r'), BoardId: ctx.boardId, MemberId: member.MemberId, Month: month, Text: text,
      Status: 'Open', CreatedAt: now_(), CreatedBy: ctx.me.MemberId, AnsweredAt: ''
    });
    return loadData_(ctx);
  } },

  setAnswered: { write: true, run: function (ctx, p) {
    var req = findRequest_(ctx, p.id);
    requireOwnOrManage_(ctx, req.MemberId);
    req.Status = p.answered ? 'Answered' : 'Open';
    req.AnsweredAt = p.answered ? now_() : '';
    update_('Requests', req);
    return loadData_(ctx);
  } },

  deleteRequest: { write: true, run: function (ctx, p) {
    var req = findRequest_(ctx, p.id);
    requireOwnOrManage_(ctx, req.MemberId);
    remove_('Requests', req);
    return loadData_(ctx);
  } },

  saveProfile: { write: true, run: function (ctx, p) {
    var member = findMember_(ctx, p.memberId || (ctx.me.BoardId === ctx.boardId ? ctx.me.MemberId : ''));
    requireOwnOrManage_(ctx, member.MemberId);
    var current = monthKey_(now_());
    var month = String(p.month || current);
    var allowed = ctx.canManage ? [current, prevMonthKey_(current)] : [current];
    if (allowed.indexOf(month) < 0) {
      throw new Error(ctx.canManage ? 'Profiles can be entered for this month or last month.' : 'You can only fill in this month\'s profile.');
    }
    var scores = p.scores || [];
    if (scores.length !== PROFILE_AREAS.length) throw new Error('Please score all ' + PROFILE_AREAS.length + ' areas.');
    scores = scores.map(function (v) { return Number(v); });
    if (!scores.every(function (v) { return v >= 1 && v <= 10 && v === Math.floor(v); })) throw new Error('Each score must be a whole number from 1 to 10.');
    var wins = String(p.wins || '').replace(/\r/g, '').trim();
    if (wins.split('\n').length > MAX_WINS_LINES) throw new Error('Please keep big wins to ' + MAX_WINS_LINES + ' lines.');
    if (wins.length > MAX_WINS_CHARS) throw new Error('Please keep big wins under ' + MAX_WINS_CHARS + ' characters.');
    var row = findProfile_(ctx.boardId, member.MemberId, month);
    var isNew = !row;
    row = row || { ProfileId: newId_('f'), BoardId: ctx.boardId, MemberId: member.MemberId, Month: month };
    PROFILE_AREAS.forEach(function (a, i) { row[a.key] = scores[i]; });
    row.Wins = wins;
    row.UpdatedAt = now_();
    row.UpdatedBy = ctx.me.MemberId;
    if (isNew) append_('Profiles', row); else update_('Profiles', row);
    return loadData_(ctx);
  } },

  saveMember: { write: true, need: 'manage', run: function (ctx, p) {
    var name = String(p.name || '').trim();
    var email = String(p.email || '').trim().toLowerCase();
    if (!name) throw new Error('Please enter a name.');
    if (!isEmail_(email)) throw new Error('Please enter a valid email address.');
    var others = boardMembers_(ctx.boardId, true).filter(function (m) { return m.MemberId !== p.id; });
    if (others.some(function (m) { return String(m.Email).toLowerCase() === email; })) throw new Error('Someone on this board already uses that email.');
    if (p.id) {
      var m = findMember_(ctx, p.id);
      m.Name = name;
      m.Email = email;
      update_('Members', m);
      syncBoardAdmin_(ctx.boardId);
    } else {
      var order = boardMembers_(ctx.boardId, false).reduce(function (mx, x) { return Math.max(mx, Number(x.SortOrder) || 0); }, 0) + 1;
      append_('Members', newMember_(ctx.boardId, name, email, ROLE.MEMBER, order));
    }
    return loadData_(ctx);
  } },

  removeMember: { write: true, need: 'manage', run: function (ctx, p) {
    var m = findMember_(ctx, p.id);
    if (m.MemberId === ctx.me.MemberId) throw new Error('You cannot remove yourself.');
    if (m.Role === ROLE.SUPER) throw new Error('The app owner cannot be removed.');
    if (m.Role === ROLE.ADMIN && !ctx.isSuper) throw new Error('Only the app owner can remove a board admin.');
    m.Active = false;
    if (m.Role === ROLE.ADMIN) m.Role = ROLE.MEMBER;
    update_('Members', m);
    syncBoardAdmin_(ctx.boardId);
    return loadData_(ctx);
  } },

  resetLink: { write: true, need: 'manage', run: function (ctx, p) {
    var m = findMember_(ctx, p.id);
    if (m.Role === ROLE.SUPER && !ctx.isSuper) throw new Error('Only the app owner can change that link.');
    m.Token = newToken_();
    update_('Members', m);
    return loadData_(ctx);
  } },

  saveBoard: { write: true, need: 'manage', run: function (ctx, p) {
    var b = ctx.board;
    var name = String(p.name || '').trim();
    var day = Number(p.alertDay), hour = Number(p.alertHour), per = Number(p.membersPerAlert);
    if (!name) throw new Error('Please enter a board name.');
    if (!(day >= 1 && day <= 31 && day === Math.floor(day))) throw new Error('Pick a day from 1 to 31.');
    if (!(hour >= 0 && hour <= 23 && hour === Math.floor(hour))) throw new Error('Pick a time.');
    if (!(per >= 1 && per <= 20 && per === Math.floor(per))) throw new Error('Pick how many members to include.');
    b.Name = name; b.AlertDay = day; b.AlertHour = hour; b.MembersPerAlert = per;
    update_('Boards', b);
    return loadData_(ctx);
  } },

  sendTestAlert: { write: true, need: 'manage', run: function (ctx) {
    var sent = sendBoardAlert_(ctx.board, false);
    var data = loadData_(ctx);
    data.notice = sent ? 'Test alert sent to ' + sent + '.' : 'Add members first.';
    return data;
  } },

  createBoard: { write: true, need: 'super', run: function (ctx, p) {
    var name = String(p.name || '').trim();
    var adminName = String(p.adminName || '').trim();
    var adminEmail = String(p.adminEmail || '').trim().toLowerCase();
    if (!name) throw new Error('Please enter a board name.');
    if (!adminName) throw new Error("Please enter the admin's name.");
    if (!isEmail_(adminEmail)) throw new Error("Please enter the admin's email address.");
    var b = newBoard_(name, adminName, adminEmail);
    append_('Members', newMember_(b.BoardId, adminName, adminEmail, ROLE.ADMIN, 1));
    var data = loadData_(context_(ctx.me.Token, b.BoardId));
    data.notice = 'Board created. Copy the admin link from Members.';
    return data;
  } },

  assignAdmin: { write: true, need: 'super', run: function (ctx, p) {
    var m = findMember_(ctx, p.id);
    boardMembers_(ctx.boardId, false).forEach(function (x) {
      if (x.Role === ROLE.ADMIN && x.MemberId !== m.MemberId) { x.Role = ROLE.MEMBER; update_('Members', x); }
    });
    if (m.Role !== ROLE.SUPER) { m.Role = ROLE.ADMIN; update_('Members', m); }
    var b = ctx.board;
    b.AdminName = m.Name; b.AdminEmail = m.Email;
    update_('Boards', b);
    return loadData_(ctx);
  } }
};

/* ------------------------------------------------------------------ */
/* Who is asking, and what they can see                                */
/* ------------------------------------------------------------------ */

function context_(token, boardId) {
  token = String(token || '').trim();
  if (!token) throw new Error('NO_LINK');
  var me = table_('Members').rows.filter(function (m) { return m.Token === token && isTrue_(m.Active); })[0];
  if (!me) throw new Error('BAD_LINK');
  var isSuper = me.Role === ROLE.SUPER;
  var target = boardId || me.BoardId;
  if (target !== me.BoardId && !isSuper) throw new Error('You can only see your own board.');
  var board = table_('Boards').rows.filter(function (b) { return b.BoardId === target; })[0];
  if (!board) throw new Error('That board was not found.');
  var isAdminHere = me.BoardId === board.BoardId && me.Role === ROLE.ADMIN;
  return { me: me, isSuper: isSuper, canManage: isSuper || isAdminHere, board: board, boardId: board.BoardId };
}

function loadData_(ctx) {
  var members = boardMembers_(ctx.boardId, true);
  var ids = {};
  members.forEach(function (m) { ids[m.MemberId] = true; });
  var requests = table_('Requests').rows.filter(function (r) { return r.BoardId === ctx.boardId && ids[r.MemberId]; });
  var url = ctx.canManage ? appUrl_() : '';
  var b = ctx.board;
  var month = monthKey_(now_());
  var prev = prevMonthKey_(month);
  var data = {
    appName: getSetting_('AppName') || APP_NAME,
    month: month,
    prevMonth: prev,
    profileAreas: PROFILE_AREAS.map(function (a) { return a.label; }),
    profiles: profilesFor_(ctx.boardId, [month, prev]).filter(function (f) { return ids[f.MemberId]; }).map(function (f) {
      return { memberId: f.MemberId, month: f.Month, scores: PROFILE_AREAS.map(function (a) { return Number(f[a.key]) || 0; }), wins: String(f.Wins || ''), updatedAt: iso_(f.UpdatedAt) };
    }),
    me: { id: ctx.me.MemberId, name: ctx.me.Name, email: ctx.me.Email, boardId: ctx.me.BoardId },
    isSuper: ctx.isSuper,
    canManage: ctx.canManage,
    board: { id: b.BoardId, name: b.Name, adminName: b.AdminName, adminEmail: b.AdminEmail },
    members: members.map(function (m) {
      var o = { id: m.MemberId, name: m.Name, email: m.Email, role: m.Role };
      if (ctx.canManage) o.link = url ? url + '?t=' + m.Token : '';
      return o;
    }),
    requests: requests.map(function (r) {
      return { id: r.RequestId, memberId: r.MemberId, month: r.Month, text: r.Text, status: r.Status || 'Open', createdAt: iso_(r.CreatedAt), answeredAt: iso_(r.AnsweredAt) };
    })
  };
  if (ctx.canManage) {
    data.board.alertDay = Number(b.AlertDay) || 1;
    data.board.alertHour = Number(b.AlertHour) || 0;
    data.board.membersPerAlert = Number(b.MembersPerAlert) || 1;
    data.board.lastAlertMonth = b.LastAlertMonth;
    data.board.nextUp = nextInRotation_(b, members).map(function (m) { return m.Name; });
    data.linksReady = !!url;
  }
  if (ctx.isSuper) {
    var all = table_('Members').rows.filter(function (m) { return isTrue_(m.Active); });
    data.boards = table_('Boards').rows.map(function (x) {
      return { id: x.BoardId, name: x.Name, adminName: x.AdminName, memberCount: all.filter(function (m) { return m.BoardId === x.BoardId; }).length };
    });
  }
  return data;
}

/** Profiles for one board in the given months. Older Sheets without a Profiles tab return none. */
function profilesFor_(boardId, months) {
  var sh = ss_().getSheetByName('Profiles');
  if (!sh) return [];
  return table_('Profiles').rows.filter(function (f) { return f.BoardId === boardId && months.indexOf(f.Month) >= 0; });
}

function findProfile_(boardId, memberId, month) {
  if (!ss_().getSheetByName('Profiles')) throw new Error('The Profiles tab is missing. Ask the app owner to run setup again.');
  return table_('Profiles').rows.filter(function (f) { return f.BoardId === boardId && f.MemberId === memberId && f.Month === month; })[0] || null;
}

function requireOwnOrManage_(ctx, memberId) {
  if (memberId !== ctx.me.MemberId && !ctx.canManage) throw new Error('You can only change your own requests.');
}

function findRequest_(ctx, id) {
  var r = table_('Requests').rows.filter(function (x) { return x.RequestId === id && x.BoardId === ctx.boardId; })[0];
  if (!r) throw new Error('That request was not found. Pull down to refresh.');
  return r;
}

function findMember_(ctx, id) {
  var m = boardMembers_(ctx.boardId, true).filter(function (x) { return x.MemberId === id; })[0];
  if (!m) throw new Error('That member was not found on this board.');
  return m;
}

function boardMembers_(boardId, activeOnly) {
  return sortMembers_(table_('Members').rows.filter(function (m) {
    return m.BoardId === boardId && (!activeOnly || isTrue_(m.Active));
  }));
}

function sortMembers_(list) {
  return list.slice().sort(function (a, b) {
    return (Number(a.SortOrder) || 0) - (Number(b.SortOrder) || 0) || String(a.Name).localeCompare(String(b.Name));
  });
}

function syncBoardAdmin_(boardId) {
  var b = table_('Boards').rows.filter(function (x) { return x.BoardId === boardId; })[0];
  var admin = boardMembers_(boardId, true).filter(function (m) { return m.Role === ROLE.ADMIN; })[0] ||
    boardMembers_(boardId, true).filter(function (m) { return m.Role === ROLE.SUPER; })[0];
  if (b && admin && (b.AdminName !== admin.Name || b.AdminEmail !== admin.Email)) {
    b.AdminName = admin.Name; b.AdminEmail = admin.Email;
    update_('Boards', b);
  }
}

/* ------------------------------------------------------------------ */
/* Monthly alerts                                                      */
/* ------------------------------------------------------------------ */

/** Runs every hour (set up by setup()). Sends each board's alert once a month on its day and hour. */
function hourlyCheck() {
  var now = now_();
  var tz = tz_();
  var y = Number(Utilities.formatDate(now, tz, 'yyyy'));
  var mo = Number(Utilities.formatDate(now, tz, 'MM'));
  var d = Number(Utilities.formatDate(now, tz, 'dd'));
  var h = Number(Utilities.formatDate(now, tz, 'HH'));
  var key = monthKey_(now);
  var results = [];
  table_('Boards').rows.forEach(function (b) {
    if (!isTrue_(b.Active)) return;
    if (normMonth_(b.LastAlertMonth) === key) return;
    var day = Math.min(Number(b.AlertDay) || 1, daysInMonth_(y, mo));
    if (d !== day || h < (Number(b.AlertHour) || 0)) return;
    try {
      var lock = LockService.getScriptLock();
      lock.waitLock(20000);
      try {
        var fresh = table_('Boards').rows.filter(function (x) { return x.BoardId === b.BoardId; })[0];
        if (fresh && normMonth_(fresh.LastAlertMonth) !== key) {
          sendBoardAlert_(fresh, true);
          results.push(fresh.BoardId);
        }
      } finally { lock.releaseLock(); }
    } catch (err) {
      Logger.log('Alert failed for board ' + b.Name + ': ' + err);
    }
  });
  return results;
}

/** The next members in line for this board's alert. */
function nextInRotation_(board, members) {
  if (!members.length) return [];
  var per = Math.min(Math.max(Number(board.MembersPerAlert) || 1, 1), members.length);
  var start = members.map(function (m) { return m.MemberId; }).indexOf(board.RotationPointer) + 1;
  var out = [];
  for (var i = 0; i < per; i++) out.push(members[(start + i) % members.length]);
  return out;
}

/**
 * Emails the board admin the next member(s) in rotation.
 * advance=true moves the rotation forward and marks this month as sent.
 * Returns the address it sent to, or '' when the board has no members.
 */
function sendBoardAlert_(board, advance) {
  var members = boardMembers_(board.BoardId, true);
  var picked = nextInRotation_(board, members);
  if (!picked.length) return '';
  var to = String(board.AdminEmail || '').trim() || ownerEmail_();
  var allReqs = table_('Requests').rows.filter(function (r) { return r.BoardId === board.BoardId; });
  var appName = getSetting_('AppName') || APP_NAME;
  var names = picked.map(function (m) { return m.Name; });
  var subject = appName + ': this month, pray for ' + names.join(', ');
  var text = [], html = ['<div style="font-family:Arial,sans-serif;font-size:15px;color:#111">'];
  html.push('<p>Here is who to pray for this month on <b>' + esc_(board.Name) + '</b>.</p>');
  text.push('Here is who to pray for this month on ' + board.Name + '.', '');
  picked.forEach(function (m) {
    var open = allReqs.filter(function (r) { return r.MemberId === m.MemberId && (r.Status || 'Open') === 'Open'; })
      .sort(function (a, b) { return dateNum_(b.CreatedAt) - dateNum_(a.CreatedAt); });
    html.push('<h3 style="margin:18px 0 6px">' + esc_(m.Name) + '</h3>');
    text.push(m.Name);
    if (!open.length) {
      html.push('<p style="color:#555">No current request. A short note asking how you can pray may be welcome.</p>');
      text.push('  No current request. A short note asking how you can pray may be welcome.');
    }
    open.forEach(function (r) {
      html.push('<p style="margin:0 0 10px;white-space:pre-line">' + esc_(r.Text) + '<br><span style="color:#777;font-size:13px">' + esc_(monthLabel_(normMonth_(r.Month))) + '</span></p>');
      text.push('  ' + String(r.Text).replace(/\n/g, '\n  ') + ' (' + monthLabel_(normMonth_(r.Month)) + ')');
    });
    html.push('<p style="margin:0 0 6px"><a href="mailto:' + esc_(m.Email) + '">Email ' + esc_(m.Name) + '</a></p>');
    text.push('  Email: ' + m.Email, '');
  });
  html.push('<hr style="border:0;border-top:1px solid #ddd;margin:20px 0"><p style="color:#555;font-size:13px">Everyone on ' + esc_(board.Name) + ':<br>');
  html.push(members.map(function (m) { return esc_(m.Name) + ' &lt;' + esc_(m.Email) + '&gt;'; }).join('<br>') + '</p>');
  if (!advance) html.push('<p style="color:#777;font-size:13px">This was a test. The rotation did not move.</p>');
  html.push('</div>');
  text.push('Everyone on ' + board.Name + ':');
  members.forEach(function (m) { text.push(m.Name + ' <' + m.Email + '>'); });
  MailApp.sendEmail({ to: to, subject: (advance ? '' : '[Test] ') + subject, body: text.join('\n'), htmlBody: html.join(''), name: appName });
  if (advance) {
    board.RotationPointer = picked[picked.length - 1].MemberId;
    board.LastAlertMonth = monthKey_(now_());
    update_('Boards', board);
  }
  return to;
}

/* ------------------------------------------------------------------ */
/* Sheet helpers                                                       */
/* ------------------------------------------------------------------ */

function ss_() { return SpreadsheetApp.getActive(); }

function table_(name) {
  var sh = ss_().getSheetByName(name);
  if (!sh) throw new Error('The ' + name + ' tab is missing. Run setup first.');
  var values = sh.getDataRange().getValues();
  var head = values.shift() || [];
  var rows = values.map(function (r, i) {
    var o = { _row: i + 2 };
    head.forEach(function (h, j) { o[h] = normCell_(name, h, r[j]); });
    return o;
  }).filter(function (o) { return o[head[0]] !== ''; });
  return { sheet: sh, head: head, rows: rows };
}

function normCell_(tab, col, v) {
  if (TEXT_COLUMNS[tab] && TEXT_COLUMNS[tab].indexOf(col) >= 0) {
    if (col === 'Month' || col === 'LastAlertMonth') return normMonth_(v);
    return v === null || v === undefined ? '' : String(v).trim();
  }
  return v;
}

function append_(name, obj) {
  var sh = ss_().getSheetByName(name);
  var head = TABS[name];
  sh.appendRow(head.map(function (h) { return obj[h] === undefined ? '' : obj[h]; }));
}

function update_(name, obj) {
  var sh = ss_().getSheetByName(name);
  var head = TABS[name];
  sh.getRange(obj._row, 1, 1, head.length).setValues([head.map(function (h) { return obj[h] === undefined ? '' : obj[h]; })]);
}

function remove_(name, obj) {
  ss_().getSheetByName(name).deleteRow(obj._row);
}

function getSetting_(key) {
  try {
    var r = table_('Settings').rows.filter(function (x) { return x.Key === key; })[0];
    return r ? String(r.Value || '').trim() : '';
  } catch (err) { return ''; }
}

function setSetting_(key, value) {
  var r = table_('Settings').rows.filter(function (x) { return x.Key === key; })[0];
  if (r) { r.Value = value; update_('Settings', r); }
  else append_('Settings', { Key: key, Value: value, Notes: '' });
}

function newBoard_(name, adminName, adminEmail) {
  var b = {
    BoardId: newId_('b'), Name: name, AdminName: adminName, AdminEmail: adminEmail,
    AlertDay: 1, AlertHour: 8, MembersPerAlert: 1, RotationPointer: '', LastAlertMonth: '', Active: true, CreatedAt: now_()
  };
  append_('Boards', b);
  return b;
}

function newMember_(boardId, name, email, role, order) {
  return { MemberId: newId_('m'), BoardId: boardId, Name: name, Email: email, Role: role, Token: newToken_(), Active: true, SortOrder: order, CreatedAt: now_() };
}

/* ------------------------------------------------------------------ */
/* Small utilities                                                     */
/* ------------------------------------------------------------------ */

function now_() { return new Date(); }
function tz_() { return Session.getScriptTimeZone() || 'America/Chicago'; }
function monthKey_(d) { return Utilities.formatDate(d, tz_(), 'yyyy-MM'); }
/** The month before a yyyy-MM key, rolling back across January. */
function prevMonthKey_(key) {
  var m = String(key).match(/^(\d{4})-(\d{2})$/);
  if (!m) return '';
  var y = Number(m[1]), mo = Number(m[2]) - 1;
  if (mo === 0) { y -= 1; mo = 12; }
  return y + '-' + ('0' + mo).slice(-2);
}
function daysInMonth_(y, m) { return new Date(y, m, 0).getDate(); }
function newId_(prefix) { return prefix + Utilities.getUuid().replace(/-/g, '').slice(0, 12); }
/** 160 random bits as letters and digits, starting with a letter so Sheets keeps it as text. */
function newToken_() { return 'p' + (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '').slice(0, 40); }
function isDate_(v) { return Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime()); }
function isTrue_(v) { return v === true || String(v).toUpperCase() === 'TRUE'; }
function isEmail_(s) { return /^[^\s@<>,;"]+@[^\s@<>,;"]+\.[^\s@<>,;"]+$/.test(s); }
function iso_(v) { return isDate_(v) ? v.toISOString() : (v ? String(v) : ''); }
function dateNum_(v) { return isDate_(v) ? v.getTime() : (Date.parse(v) || 0); }
function roleLabel_(r) { return r === ROLE.SUPER ? 'app owner' : r === ROLE.ADMIN ? 'board admin' : 'member'; }
function ownerEmail_() {
  try { return Session.getEffectiveUser().getEmail() || ''; } catch (err) { return ''; }
}

function normMonth_(v) {
  if (isDate_(v)) return Utilities.formatDate(v, tz_(), 'yyyy-MM');
  var s = String(v === null || v === undefined ? '' : v).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})/);
  return m ? m[1] + '-' + ('0' + m[2]).slice(-2) : s;
}

function monthLabel_(key) {
  var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var m = String(key).match(/^(\d{4})-(\d{2})$/);
  return m ? names[Number(m[2]) - 1] + ' ' + m[1] : String(key);
}

function cleanAppUrl_(u) {
  u = String(u || '').trim().replace(/\?.*$/, '').replace(/\/dev$/, '/exec');
  return /^https:\/\/script\.google\.com\/.+\/exec$/.test(u) ? u : '';
}

function appUrl_() {
  var u = cleanAppUrl_(getSetting_('AppUrl'));
  if (u) return u;
  try { return cleanAppUrl_(ScriptApp.getService().getUrl()); } catch (err) { return ''; }
}

function esc_(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

  function monthKeyOffset(off) {

    ['Russell Grigsby', 'Casey Turner', 'Riley Bennett', 'Taylor Brooks', 'Avery Collins', 'Quinn Harper', 'Drew Mitchell',

      if (k === 'withFailureHandler') return function (fn) { return runner(ok, fn); };
      return function () {
        var args = arguments;

          try {
            var res = JSON.parse(JSON.stringify(window[k].apply(null, args)));

            }

  }

})();

  .chip.green { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }
  .chip:active { background: var(--navy-3); }
  .linkbox { width: 100%; margin-top: 8px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--navy); color: var(--muted); padding: 8px 10px; font-size: 13px; }
  .steps { margin: 0; padding-left: 22px; color: var(--text); }
  .steps li { margin: 0 0 8px; font-size: 16px; }

  /* Drawer and sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(82vw, 330px); background: var(--navy-2); z-index: 50; transform: translateX(-105%); transition: transform .25s ease; padding: calc(var(--safe-top) + 18px) 0 var(--safe-bottom); overflow-y: auto; }
  .drawer.on { transform: none; }
  .drawer .me { padding: 0 20px 16px; border-bottom: 1px solid var(--line); }
  .drawer .me b { display: block; font-size: 19px; }
  .drawer .me small { color: var(--muted); }
  .drawer button { display: flex; width: 100%; align-items: center; gap: 14px; min-height: 56px; padding: 0 20px; border: 0; background: transparent; color: var(--text); font-size: 17px; text-align: left; }
  .drawer button:active { background: var(--navy-3); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--navy-2); border-radius: 20px 20px 0 0; padding: 10px 18px calc(var(--safe-bottom) + 12px); max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease; }
  .sheet.on { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--navy-3); margin: 0 auto 10px; }
  .sheet h2 { margin: 4px 0 2px; font-size: 21px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 96px); z-index: 60; background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 24px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.35); max-width: 88vw; text-align: center; display: none; }
  .toast.on { display: block; }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 70vh; color: var(--muted); text-align: center; padding: 24px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--navy-3); border-top-color: var(--gold-2); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (min-width: 760px) {
    main, .top, .search { max-width: 720px; margin-left: auto; margin-right: auto; }
    .paper { border-radius: 0 0 16px 16px; }
  }

  .demo-bar { background: #d7b883; color: #10262f; font-size: 13px; padding: 6px 12px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .demo-bar b { font-weight: 800; letter-spacing: .03em; white-space: nowrap; }
  .demo-bar b { flex: 1; }
  .demo-bar label { order: 3; flex: 1 1 100%; display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; white-space: nowrap; }
  .demo-bar select { flex: 1; min-width: 0; min-height: 40px; border-radius: 10px; border: 1px solid rgba(16,38,47,.35); background: #fff8ec; color: #10262f; font-size: 15px; padding: 0 8px; }
  .demo-bar button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(16,38,47,.5); background: transparent; color: #10262f; font-weight: 700; font-size: 14px; }
</style>

      <p>Demo with sample data. Enter the passcode to continue.</p>
      <input id="gate-code" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode">

  <script>
    (function () {
      var KEY = 'c12-prayer-demo-unlock', SALT = 'bb3d525e1363d78118b0ab644bfad324', HASH = 'fe9d085a230a7601a6dcb34a54ba7a62231bb043e8657d53be60b780e82be2fd';
      function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
      // Demo menu (hamburger at the top right of the demo bar).
      function menu() { return document.getElementById('demo-menu'); }
      function menuBtn() { return document.getElementById('demo-menu-btn'); }
      function closeMenu(focusBtn) {
        var m = menu(); if (!m || m.hidden) return;
        m.hidden = true; menuBtn().setAttribute('aria-expanded', 'false');
        if (focusBtn) menuBtn().focus();
      }
      function openMenu() {
        var m = menu(); m.hidden = false; menuBtn().setAttribute('aria-expanded', 'true');
        var first = m.querySelector('button'); if (first) first.focus();
      }
      document.addEventListener('click', function (ev) {
        var t = ev.target;
        if (!t.closest) return;
        if (t.closest('#demo-menu-btn')) { if (menu().hidden) openMenu(); else closeMenu(false); return; }
        if (t.closest('#demo-menu button')) { closeMenu(false); return; }
        if (!t.closest('#demo-menu')) closeMenu(false);
      });
      document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeMenu(true); });
      // Log out: forget the unlock on this device and show the passcode screen again.
      // The demo's sample data and the chosen persona are kept.
      // The demo bar comes after this script, so listen on the document.
      document.addEventListener('click', function (ev) {
        if (!ev.target.closest || !ev.target.closest('#demo-logout')) return;
        try { localStorage.removeItem(KEY); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        document.documentElement.classList.remove('unlocked');
        document.getElementById('gate-code').value = '';
        document.getElementById('gate-err').textContent = '';
        window.scrollTo(0, 0);
        document.getElementById('gate-code').focus();
      });
      document.getElementById('gate-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var err = document.getElementById('gate-err');
        var val = document.getElementById('gate-code').value.trim();
        if (!window.crypto || !crypto.subtle) { err.textContent = 'Please open this page over https.'; return; }
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + ':' + val)).then(function (d) {
          if (hex(d) === HASH) {
            try { localStorage.setItem(KEY, HASH); } catch (e) {}
            document.documentElement.className += ' unlocked';
          } else {
            err.textContent = 'That passcode did not work. Please try again.';
          }
        });
      });
    })();
  </script>

  <script>
    (function () {
      var sel = document.getElementById('demo-persona');
      var groups = {};
      window.DEMO_PERSONAS.forEach(function (p) {
        if (!groups[p.role]) { groups[p.role] = document.createElement('optgroup'); groups[p.role].label = p.role; sel.appendChild(groups[p.role]); }

      pts.forEach(function (p) { out.push('<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.8" fill="#1e3c49" stroke="#fff" stroke-width="1.5"/>'); });
    }
    labels.forEach(function (lab, i) {
      var p = pt(i, R + 15), dx = p[0] - cx, dy = p[1] - cy;
      var words = lab.split(' '), lines;
      if (lab.length <= 13 && i === 0) lines = [lab];
      else if (words[1] === '&') lines = [words[0] + ' &', words.slice(2).join(' ')];
      else lines = [words.slice(0, Math.ceil(words.length / 2)).join(' '), words.slice(Math.ceil(words.length / 2)).join(' ')];

      var total = lines.length + (scores ? 1 : 0), lh = 15;

          '<button data-act="delete" data-id="' + h(r.id) + '">' + ICON.x + 'Delete</button></div>' : '';
        return '<div class="req' + (done ? ' answered' : '') + '"><div class="body"><div class="meta"><span class="date">Date created ' + h(fmtDate(r.createdAt)) + '</span>' +
          (done ? '<span class="status done">Answered ' + h(fmtDate(r.answeredAt)) + '</span>' : '<span class="status">Praying</span>') + '</div><div class="text">' + h(r.text) + '</div></div>' + acts + '</div>';
      }).join('');
    }).join('');
    if (!list.length) body = '<p style="padding:20px;color:#6b7785">No prayer requests yet.' + (edit ? ' Tap + to add one.' : '') + '</p>';
    var tab = S.memberTab === 'profile' ? 'profile' : 'prayer';
    var seg = '<div class="seg"><button class="' + (tab === 'prayer' ? 'on' : '') + '" data-act="tab-prayer">Prayer requests</button><button class="' + (tab === 'profile' ? 'on' : '') + '" data-act="tab-profile">Profile</button></div>';
    if (tab === 'profile') body = profileBlock(m);
    return '<div class="paper"><div class="head"><h1>' + h(m.name) + '</h1>' + (m.email ? '<a href="mailto:' + h(m.email) + '">' + h(m.email) + '</a>' : '') + '</div>' + seg + body + emailBlock() + '<div style="height:110px"></div></div>';
  }

  function profileBlock(m) {
    var d = D();
    return [d.month, d.prevMonth].map(function (k) {
      var p = profileFor(m.id, k), can = canEditProfile(m.id, k);
      var head = '<div class="ptop"><div><h3>' + h(monthLabel(k)) + '</h3><small>' + (k === d.month ? 'This month' : 'Last month') + (p && p.updatedAt ? ' · updated ' + h(fmtDate(p.updatedAt)) : '') + '</small></div>' +
        (p && can ? '<button class="edit-btn" data-act="profile-edit" data-id="' + h(m.id) + '" data-month="' + h(k) + '">Edit</button>' : '') + '</div>';
      if (!p) {
        var label = k === d.month ? 'Add this month\'s profile' : 'Add ' + h(monthName(k)) + '\'s profile';
        return '<div class="prof">' + head + '<div class="prof-empty">No Balance Wheel for ' + h(monthName(k)) + ' yet.' +
          (can ? '<button class="btn-wide" data-act="profile-edit" data-id="' + h(m.id) + '" data-month="' + h(k) + '">' + label + '</button>' : '') + '</div></div>';
      }
      return '<div class="prof">' + head + radar(p.scores, d.profileAreas) + (p.wins ? '<div class="wins"><p class="label">Big wins and notable events</p><p>' + h(p.wins) + '</p></div>' : '') + '</div>';
    }).join('');
  }

  function prayList() {
    return D().members.map(function (m) { return { m: m, open: openFor(m.id) }; }).filter(function (x) { return x.open.length; });
  }

  function viewPray() {
    var list = prayList();
    if (!list.length) return '<div class="empty">There are no open prayer requests yet.</div>' + emailBlock();
    if (S.prayIndex >= list.length) {
      return '<div class="pray-card"><h2>Amen.</h2><p class="text">You prayed for everyone on the list. Consider sending a short note below to let them know.</p></div>' +
        '<div class="pray-nav"><button class="btn-wide ghost" data-act="pray-start">Start over</button><button class="btn-wide" data-act="home">Done</button></div>' + emailBlock();
    }
    var x = list[S.prayIndex];
    return '<div class="pray-card"><p class="small">Pray for</p><h2>' + h(x.m.name) + '</h2>' +
      x.open.map(function (r) { return '<p class="text">' + h(r.text) + '</p><p class="small">' + h(monthLabel(r.month)) + '</p>'; }).join('') +
      (x.m.email ? '<a class="btn-wide ghost" style="color:#1d2733;border-color:#dfe4ea" href="mailto:' + h(x.m.email) + '?subject=' + encodeURIComponent('Praying for you') + '">Email ' + h(x.m.name) + '</a>' : '') + '</div>' +
      '<div class="pray-nav"><button class="btn-wide ghost" data-act="pray-prev"' + (S.prayIndex ? '' : ' disabled style="opacity:.4"') + '>Back</button><button class="btn-wide" data-act="pray-next">Next</button></div>' +
      '<p class="counter">' + (S.prayIndex + 1) + ' of ' + list.length + '</p>';
  }

  function viewMembers() {
    var d = D();
    var intro = d.linksReady
      ? 'Each person has a private link. Send it only to that person. Anyone with a link can add and change that person\'s requests.'
      : 'Personal links appear here after the app owner saves the web app link in the Sheet (C12 Prayer menu, Save the web app link).';
    var rows = d.members.map(function (m) {
      var role = m.role === 'super' ? 'App owner' : m.role === 'admin' ? 'Board admin' : '';
      var btns = '<button class="chip" data-act="member-edit" data-id="' + h(m.id) + '">Edit</button>';
      if (m.link) btns += '<button class="chip green" data-act="copy" data-id="' + h(m.id) + '">Copy link</button>';
      if (!(m.role === 'super' && !d.isSuper)) btns += '<button class="chip" data-act="reset" data-id="' + h(m.id) + '">New link</button>';
      if (d.isSuper && m.role === 'member') btns += '<button class="chip" data-act="make-admin" data-id="' + h(m.id) + '">Make board admin</button>';
      if (m.id !== d.me.id && m.role !== 'super' && (m.role !== 'admin' || d.isSuper)) btns += '<button class="chip" data-act="remove" data-id="' + h(m.id) + '">Remove</button>';
      return '<div class="mrow"><div class="top-line"><b>' + h(m.name) + '</b><small style="color:#d7b883">' + role + '</small></div><div class="email">' + h(m.email) + '</div>' +
        (m.link ? '<input class="linkbox" readonly value="' + h(m.link) + '" id="link-' + h(m.id) + '">' : '') + '<div class="btns">' + btns + '</div></div>';
    }).join('');
    return '<div class="section"><h2>' + d.members.length + (d.members.length === 1 ? ' member' : ' members') + '</h2><p>' + h(intro) + '</p><button class="btn-wide" data-act="member-add">Add a member</button></div>' +
      '<div class="section">' + (rows || '<p>No members yet.</p>') + '</div>';
  }

  function viewBoard() {
    var b = D().board, days = '', hours = '', per = '';
    for (var i = 1; i <= 31; i++) days += '<option value="' + i + '"' + (i === b.alertDay ? ' selected' : '') + '>' + ordinal(i) + (i > 28 ? ' (or the last day)' : '') + '</option>';
    for (var j = 0; j < 24; j++) hours += '<option value="' + j + '"' + (j === b.alertHour ? ' selected' : '') + '>' + hourLabel(j) + '</option>';
    for (var k = 1; k <= Math.max(1, Math.min(20, D().members.length || 1)); k++) per += '<option value="' + k + '"' + (k === b.membersPerAlert ? ' selected' : '') + '>' + k + '</option>';
    var next = (b.nextUp || []).join(', ') || 'No members yet';
    return '<div class="section"><h2>Monthly alert</h2><p>Once a month, ' + h(b.adminEmail || 'the board admin') + ' gets an email with the next member\'s prayer requests, taking turns through the list.</p>' +
      '<label class="field"><span>Board name</span><input id="b-name" value="' + h(b.name) + '" maxlength="80"></label>' +
      '<div class="two"><label class="field"><span>Day of the month</span><select id="b-day">' + days + '</select></label>' +
      '<label class="field"><span>Time</span><select id="b-hour">' + hours + '</select></label></div>' +
      '<label class="field"><span>Members in each alert</span><select id="b-per">' + per + '</select></label>' +
      '<button class="btn-wide" data-act="board-save">Save</button></div>' +
      '<div class="section"><h2>Next up</h2><p>' + h(next) + '</p>' + (b.lastAlertMonth ? '<p>Last alert sent: ' + h(monthLabel(b.lastAlertMonth)) + '</p>' : '') +
      '<button class="btn-wide ghost" data-act="test-alert">Send me a test alert now</button><p style="margin-top:10px">A test does not change whose turn is next.</p></div>';
  }

  function viewBoards() {
    var d = D();
    var rows = (d.boards || []).map(function (b) {
      var here = b.id === d.board.id;
      return '<div class="mrow"><div class="top-line"><b>' + h(b.name) + '</b><small style="color:#d7b883">' + (here ? 'Open now' : '') + '</small></div>' +
        '<div class="email">Admin: ' + h(b.adminName || 'none') + ' · ' + b.memberCount + ' members</div>' +
        '<div class="btns">' + (here ? '' : '<button class="chip green" data-act="switch" data-id="' + h(b.id) + '">Open this board</button>') + '</div></div>';
    }).join('');
    return '<div class="section"><h2>Boards</h2><p>Each board has its own members, admin, alert, and email list. Members see only their own board.</p>' + rows + '</div>' +
      '<div class="section"><button class="btn-wide" data-act="board-add">Add a board</button></div>';
  }

  function viewInstall() {
    return '<div class="section"><h2>iPhone</h2><ol class="steps"><li>Open your personal link in Safari.</li><li>Tap the Share button (a square with an arrow pointing up).</li><li>Scroll down and tap Add to Home Screen.</li><li>If you see Open as Web App, leave it on.</li><li>Tap Add.</li></ol></div>' +
      '<div class="section"><h2>Android</h2><ol class="steps"><li>Open your personal link in Chrome.</li><li>Tap the three dots at the top right.</li><li>Tap Add to Home screen, then Add.</li></ol></div>' +
      '<div class="section"><h2>Windows computer</h2><ol class="steps"><li>Open your personal link in Microsoft Edge.</li><li>Click the three dots at the top right.</li><li>Choose Apps, then Install this site as an app.</li></ol></div>';
  }

  /* ---------- sheets (forms) ---------- */
  function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('sheet').classList.add('on'); $('scrim').classList.add('on'); }
  function closeAll() { $('sheet').oninput = null; $('sheet').classList.remove('on'); $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); }

  function monthOptions(selected) {
    var now = D().month.split('-'), y = +now[0], m = +now[1], out = '';
    for (var i = -2; i <= 2; i++) {
      var d = new Date(y, m - 1 + i, 1), k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
      out += '<option value="' + k + '"' + (k === selected ? ' selected' : '') + '>' + monthLabel(k) + '</option>';
    }
    if (selected && out.indexOf('"' + selected + '"') < 0) out = '<option value="' + h(selected) + '" selected>' + h(monthLabel(selected)) + '</option>' + out;
    return out;
  }

  function requestSheet(req, forMemberId) {
    var d = D(), who;
    var target = req ? req.memberId : (forMemberId || (onMyBoard() ? d.me.id : (d.members[0] || {}).id));
    if (!req && d.canManage) {
      who = '<label class="field"><span>For</span><select id="r-member">' + d.members.map(function (m) { return '<option value="' + h(m.id) + '"' + (m.id === target ? ' selected' : '') + '>' + h(m.name) + (isMine(m.id) ? ' (you)' : '') + '</option>'; }).join('') + '</select></label>';
    } else {
      who = '<input type="hidden" id="r-member" value="' + h(target) + '"><p style="color:var(--muted);margin:0">For ' + h((member(target) || {}).name || '') + '</p>';
    }
    openSheet('<h2>' + (req ? 'Edit request' : 'New prayer request') + '</h2>' + who +
      '<label class="field"><span>Month</span><select id="r-month">' + monthOptions(req ? req.month : d.month) + '</select></label>' +
      '<label class="field"><span>Prayer request</span><textarea id="r-text" maxlength="2000" placeholder="How can the group pray for you? Put each item on its own line.">' + h(req ? req.text : '') + '</textarea></label>' +
      '<button class="btn-wide" data-act="request-save" data-id="' + h(req ? req.id : '') + '">Save</button><button class="btn-wide ghost" data-act="close">Cancel</button>');
  }

  function profileSheet(memberId, month) {
    var d = D(), m = member(memberId), p = profileFor(memberId, month);
    var scores = p ? p.scores.slice() : d.profileAreas.map(function () { return 5; });
    var rows = d.profileAreas.map(function (lab, i) {
      return '<div class="score-row"><div class="lab"><span>' + h(lab) + '</span><b id="sv-' + i + '">' + scores[i] + '</b></div>' +
        '<input type="range" min="1" max="10" step="1" value="' + scores[i] + '" data-score="' + i + '" aria-label="' + h(lab) + '"></div>';
    }).join('');
    openSheet('<h2>Balance Wheel</h2><p style="color:var(--muted);margin:0">' + h(m.name) + ', ' + h(monthLabel(month)) + '. Score each area from 1 (needs attention) to 10 (thriving).</p>' +
      '<div class="preview" id="pf-preview">' + radar(scores, d.profileAreas, true) + '</div>' + rows +
      '<label class="field"><span>Big wins and notable events (optional, up to 3 lines)</span><textarea id="pf-wins" rows="3" maxlength="400" style="min-height:96px" placeholder="One short line each">' + h(p ? p.wins : '') + '</textarea></label>' +
      '<button class="btn-wide" data-act="profile-save" data-id="' + h(memberId) + '" data-month="' + h(month) + '">Save</button><button class="btn-wide ghost" data-act="close">Cancel</button>');
    var sheet = $('sheet');
    sheet.oninput = function (ev) {
      var el = ev.target;
      if (el.getAttribute && el.getAttribute('data-score') !== null) {
        $('sv-' + el.getAttribute('data-score')).textContent = el.value;
        $('pf-preview').innerHTML = radar(currentScores(), d.profileAreas, true);
      }
      if (el.id === 'pf-wins') {
        var lines = el.value.split('\n');
        if (lines.length > 3) { el.value = lines.slice(0, 3).join('\n'); }
      }
    };
  }

  function currentScores() {
    return Array.prototype.map.call(document.querySelectorAll('#sheet input[data-score]'), function (x) { return +x.value; });
  }

  function memberSheet(m) {
    openSheet('<h2>' + (m ? 'Edit member' : 'Add a member') + '</h2>' +
      '<label class="field"><span>Name</span><input id="m-name" value="' + h(m ? m.name : '') + '" maxlength="60" autocomplete="off"></label>' +
      '<label class="field"><span>Email</span><input id="m-email" type="email" inputmode="email" autocapitalize="off" value="' + h(m ? m.email : '') + '" autocomplete="off"></label>' +
      '<button class="btn-wide" data-act="member-save" data-id="' + h(m ? m.id : '') + '">Save</button><button class="btn-wide ghost" data-act="close">Cancel</button>');
  }

  function boardSheet() {
    openSheet('<h2>Add a board</h2><p style="color:var(--muted);margin:0">The admin you name here runs this board: members, requests, and the monthly alert.</p>' +
      '<label class="field"><span>Board name</span><input id="nb-name" maxlength="80"></label>' +
      '<label class="field"><span>Admin name</span><input id="nb-admin" maxlength="60"></label>' +
      '<label class="field"><span>Admin email</span><input id="nb-email" type="email" inputmode="email" autocapitalize="off"></label>' +
      '<button class="btn-wide" data-act="board-create">Create board</button><button class="btn-wide ghost" data-act="close">Cancel</button>');
  }

  function confirmSheet(title, text, act, id, label) {
    openSheet('<h2>' + h(title) + '</h2><p style="color:var(--muted)">' + h(text) + '</p><button class="btn-wide danger" data-act="' + act + '" data-id="' + h(id) + '">' + h(label) + '</button><button class="btn-wide ghost" data-act="close">Cancel</button>');
  }

  function copyLink(id) {
    var m = member(id), box = $('link-' + id);
    if (!m || !m.link) return;
    var done = function () { toast('Link for ' + m.name + ' copied.'); };
    var fallback = function () { if (box) { box.focus(); box.select(); box.setSelectionRange(0, 9999); } try { if (document.execCommand('copy')) return done(); } catch (e) {} toast('Press and hold the link, then tap Copy.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m.link).then(done, fallback); else fallback();
  }

  /* ---------- one click handler for everything ---------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    var d = D();
    switch (act) {
      case 'menu': $('drawer').classList.add('on'); $('scrim').classList.add('on'); break;
      case 'close': closeAll(); break;
      case 'home': go('home'); break;
      case 'pray': case 'pray-start': go('pray'); break;
      case 'pray-next': S.prayIndex++; render(); window.scrollTo(0, 0); break;
      case 'pray-prev': S.prayIndex = Math.max(0, S.prayIndex - 1); render(); window.scrollTo(0, 0); break;
      case 'mine': S.memberTab = 'prayer'; go('member', d.me.id); break;
      case 'my-profile': S.memberTab = 'profile'; go('member', d.me.id); break;
      case 'tab-prayer': S.memberTab = 'prayer'; render(); break;
      case 'tab-profile': S.memberTab = 'profile'; render(); break;
      case 'profile-mine': profileSheet(d.me.id, d.month); break;
      case 'profile-edit': profileSheet(id, el.getAttribute('data-month')); break;
      case 'profile-save': run('saveProfile', { memberId: id, month: el.getAttribute('data-month'), scores: currentScores(), wins: $('pf-wins').value }, 'Profile saved.'); break;
      case 'members': case 'board': case 'boards': case 'install': go(act); break;
      case 'refresh': closeAll(); run('load', {}, 'Up to date.'); break;
      case 'open': go('member', id); break;
      case 'add-mine': requestSheet(null, d.me.id); break;
      case 'edit': requestSheet(d.requests.filter(function (r) { return r.id === id; })[0]); break;
      case 'request-save': run('saveRequest', { id: id || null, memberId: $('r-member').value, month: $('r-month').value, text: $('r-text').value }, 'Saved.'); break;
      case 'answer': run('setAnswered', { id: id, answered: true }, 'Marked answered. Praise God!'); break;
      case 'unanswer': run('setAnswered', { id: id, answered: false }, 'Moved back to praying.'); break;
      case 'delete': confirmSheet('Delete this request?', 'This cannot be undone.', 'delete-yes', id, 'Delete'); break;
      case 'delete-yes': run('deleteRequest', { id: id }, 'Deleted.'); break;
      case 'member-add': memberSheet(null); break;
      case 'member-edit': memberSheet(member(id)); break;
      case 'member-save': run('saveMember', { id: id || null, name: $('m-name').value, email: $('m-email').value }, 'Saved.'); break;
      case 'copy': copyLink(id); break;
      case 'reset': confirmSheet('Make a new link?', 'The old link for ' + member(id).name + ' will stop working. Send them the new one.', 'reset-yes', id, 'Make a new link'); break;
      case 'reset-yes': run('resetLink', { id: id }, 'New link ready. Copy it and send it.'); break;
      case 'remove': confirmSheet('Remove ' + member(id).name + '?', 'Their link stops working and they leave the list. Their past requests stay in the Sheet.', 'remove-yes', id, 'Remove'); break;
      case 'remove-yes': run('removeMember', { id: id }, 'Removed.'); break;
      case 'make-admin': run('assignAdmin', { id: id }, member(id).name + ' is now the board admin.'); break;
      case 'board-save': run('saveBoard', { name: $('b-name').value, alertDay: +$('b-day').value, alertHour: +$('b-hour').value, membersPerAlert: +$('b-per').value }, 'Saved.'); break;
      case 'test-alert': run('sendTestAlert', {}); break;
      case 'board-add': boardSheet(); break;
      case 'board-create':
        var prevBoard = S.boardId;
        S.boardId = null;
        run('createBoard', { name: $('nb-name').value, adminName: $('nb-admin').value, adminEmail: $('nb-email').value }).then(function () {
          if (!S.boardId) { S.boardId = prevBoard; return; }
          if (S.boardId !== prevBoard) go('members');
        });
        break;
      case 'switch': S.boardId = id; S.view = 'home'; run('load', {}, 'Opened ' + ((d.boards || []).filter(function (b) { return b.id === id; })[0] || {}).name + '.'); break;
    }
  });
  $('scrim').addEventListener('click', closeAll);
  $('fab').addEventListener('click', function () { requestSheet(null, S.view === 'member' && canEdit(S.memberId) ? S.memberId : null); });

  start();
})();
</script>
</body>
</html>
